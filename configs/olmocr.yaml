# olmOCR от AllenAI — Qwen2-VL-7B, дообученный на 250K страницах.
# Чекпоинт: allenai/olmOCR-7B-0225-preview
#
# Окружение: Kaggle T4 x2 (sm_75, 16+16 ГБ).
# device_map="auto" автоматически раскладывает 7B-веса между двумя картами,
# поэтому max_image_long_side можно поднять до 1536 (P100 -> 1280 был тесен).
# T4 поддерживает flash-attn 2 — включаем его для ~2x ускорения.

model:
  name: olmocr
  hf_repo: allenai/olmOCR-7B-0225-preview
  trust_remote_code: false
  torch_dtype: float16
  device_map: auto
  attn_implementation: flash_attention_2   # T4 sm_75; fallback на sdpa в коде
  low_cpu_mem_usage: true

inference:
  use_anchor_text: false        # на OmniDocBench у нас уже PNG, без PDF
  max_new_tokens: 3000
  temperature: 0.0
  pipeline_concurrency: 1
  max_image_long_side: 1536     # T4 x2 → больше памяти, можно вернуть качество

dataset:
  name: omnidocbench
  subset_size: 100
  split: test

output:
  results_dir: results/olmocr
  save_format: jsonl
