# mPLUG-DocOwl — серия от Alibaba; для оценки берём DocOwl2 / DocOwl-1.5
# Чекпоинт: mPLUG/DocOwl2  или  mPLUG/DocOwl1.5-Chat

model:
  name: mplug_docowl
  hf_repo: mPLUG/DocOwl2
  trust_remote_code: true
  torch_dtype: bfloat16
  device_map: auto

inference:
  prompt: "Parse this document. Output structure as markdown including tables in HTML."
  high_resolution: true        # DocOwl2 поддерживает high-res shape-adaptive cropping
  resolution: 1024
  max_new_tokens: 4096
  do_sample: false
  num_beams: 1

dataset:
  name: omnidocbench
  subset_size: 100
  split: test

output:
  results_dir: results/mplug_docowl
  save_format: jsonl
