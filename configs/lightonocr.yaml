# LightOnOCR-2-1B — компактная (~1B) OCR-модель от LightOn AI, выпущена 2025.
# Чекпоинт: lightonai/LightOnOCR-2-1B
# Использует transformers + processor с chat-шаблоном (image+text → text).

model:
  name: lightonocr
  hf_repo: lightonai/LightOnOCR-2-1B
  trust_remote_code: true
  torch_dtype: float16          # P100 не любит bf16
  device_map: auto
  attn_implementation: eager

inference:
  prompt: "Convert this document page to markdown. Preserve tables as HTML and equations as LaTeX."
  max_new_tokens: 4096
  do_sample: false
  num_beams: 1

dataset:
  name: omnidocbench
  subset_size: 100
  split: test

output:
  results_dir: results/lightonocr
  save_format: jsonl
