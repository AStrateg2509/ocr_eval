# DeepSeek-OCR (релиз 2025) — мульти-модальная OCR-модель, ~3B параметров.
# Чекпоинт: deepseek-ai/DeepSeek-OCR
# API: model.infer(tokenizer, prompt=..., image_file=..., output_path=...,
#                  base_size=..., image_size=..., crop_mode=...,
#                  save_results=True, test_compress=True)
#
# !!! Важно: метод НЕ возвращает markdown как строку — он пишет файл
# `<output_path>/result.mmd`. Поэтому ставим save_results: true и читаем
# результат с диска в коде ноутбука.
#
# Окружение: T4 x2 (sm_75). DeepSeek-OCR может тянуть flash-attn через
# trust_remote_code; на T4 это работает. attn_implementation НЕ форсируется
# здесь — оставляем дефолт кастомного modeling-кода DeepSeek.

model:
  name: deepseek_ocr
  hf_repo: deepseek-ai/DeepSeek-OCR
  trust_remote_code: true
  torch_dtype: float16          # bf16 → fp16 для совместимости с потребительскими GPU
  device_map: auto              # T4 x2 → accelerate сама раскладывает

inference:
  prompt: "<image>\n<|grounding|>Convert the document to markdown."
  base_size: 1024
  image_size: 640
  crop_mode: true
  max_new_tokens: 8192
  save_results: true            # ← без этого result.mmd не появится
  test_compress: true
  result_filename: result.mmd

dataset:
  name: omnidocbench
  subset_size: 100
  split: test
  categories: [text, table, formula, layout]

output:
  results_dir: results/deepseek_ocr
  save_format: jsonl
